<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scorecards - cloutrik</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; padding: 32px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #120a26; color: #f5f3ff; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #c9c2e8; margin-top: 0; }
  .leaderboard { max-width: 100%; margin: 24px 0 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 16px; }
  .card img { width: 100%; height: auto; display: block; border-radius: 18px; }
  .card { text-decoration: none; }
  code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Scorecards de contribuicao - cloutrik</h1>
  <p class="sub">Atualizado automaticamente todas as noites via GitHub Actions.</p>
  <div class="leaderboard"><img src="leaderboard.svg" alt="Ranking de contribuicao" /></div>
  <div class="grid">
    
    <a class="card" href="certificates/ClaudioMatheusDev.svg" target="_blank" rel="noopener">
      <img src="certificates/ClaudioMatheusDev.svg" alt="Scorecard de ClaudioMatheusDev" loading="lazy" />
    </a>
  

    <a class="card" href="certificates/PatrickCalorioCarvalho.svg" target="_blank" rel="noopener">
      <img src="certificates/PatrickCalorioCarvalho.svg" alt="Scorecard de PatrickCalorioCarvalho" loading="lazy" />
    </a>
  

    <a class="card" href="certificates/viniciusbassio.svg" target="_blank" rel="noopener">
      <img src="certificates/viniciusbassio.svg" alt="Scorecard de viniciusbassio" loading="lazy" />
    </a>
  
  </div>
</body>
</html>
