name: Scorecard

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Gerar scorecards
        run: node src/index.js
        env:
          GH_TOKEN: ${{ secrets.ORG_SCORECARD_TOKEN }}
          ORG_NAME: ${{ secrets.ORG_NAME }}

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/certificates data/badges data/leaderboard.svg
          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "chore: atualiza scorecards de contribuicao [skip ci]"
            git push
          fi
